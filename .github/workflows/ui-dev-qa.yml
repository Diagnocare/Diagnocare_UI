# ============================================================
# UI Build & Deploy (Dev/QA) — fast path
# - Build on ubuntu-latest (cached npm)
# - Deploy: zip + OpenSSH + remote PowerShell script
# - Push → DEV only; workflow_dispatch can also deploy QA
# ============================================================

name: UI Build & Deploy (Dev/QA)

on:
  push:
    branches:
      - master_UI
    paths:
      - "Diagnocare-UI/**"
      - ".github/workflows/ui-dev-qa.yml"
  workflow_dispatch:
    inputs:
      deploy_qa:
        description: "Also deploy QA (builds QA config in parallel with DEV)"
        type: boolean
        default: false
        required: true

concurrency:
  group: ui-dev-qa-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: ${{ vars.NODE_VERSION || '22' }}

jobs:
  deploy-dev:
    name: Build & Deploy DEV
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: Diagnocare-UI

    steps:
      - name: Checkout UI only
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            Diagnocare-UI
          sparse-checkout-cone-mode: true
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: Diagnocare-UI/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build DEV
        run: npx ng build --configuration development --progress=false

      - name: Package + deploy DEV via SSH
        working-directory: .
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          IIS_SITE: ${{ vars.DEV_IIS_SITE_NAME }}
          IIS_TARGET: ${{ vars.DEV_UI_TARGET_PATH }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq sshpass >/dev/null
          ZIP="/tmp/ui-dev-${RUN_ID}.zip"
          PS1_LOCAL="/tmp/deploy-ui.ps1"
          (cd Diagnocare-UI/dist/diagnocareUI-app && zip -qr "$ZIP" .)
          cat > "$PS1_LOCAL" <<'PSEOF'
          param(
            [Parameter(Mandatory=$true)][string]$Site,
            [Parameter(Mandatory=$true)][string]$Target,
            [Parameter(Mandatory=$true)][string]$ZipPath
          )
          $ErrorActionPreference = 'Stop'
          Write-Host "Site=$Site Target=$Target Zip=$ZipPath"
          Import-Module WebAdministration
          $stage = Join-Path $env:TEMP ("ui-stage-" + [guid]::NewGuid().ToString('N'))
          try {
            if ((Get-Website -Name $Site).State -eq 'Started') { Stop-Website -Name $Site }
            New-Item -ItemType Directory -Path $stage | Out-Null
            Expand-Archive -LiteralPath $ZipPath -DestinationPath $stage -Force
            if (-not (Test-Path -LiteralPath $Target)) { New-Item -ItemType Directory -Path $Target | Out-Null }
            Get-ChildItem -LiteralPath $Target -Force -ErrorAction SilentlyContinue | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
            & robocopy $stage $Target /E /NFL /NDL /NJH /NJS /nc /ns /np | Out-Null
            if ($LASTEXITCODE -ge 8) { throw "robocopy failed with exit $LASTEXITCODE" }
            if ((Get-Website -Name $Site).State -ne 'Started') { Start-Website -Name $Site }
            Write-Host '[OK] UI deployed'
          } finally {
            if (Test-Path -LiteralPath $stage) { Remove-Item -Recurse -Force $stage -ErrorAction SilentlyContinue }
            if (Test-Path -LiteralPath $ZipPath) { Remove-Item -Force $ZipPath -ErrorAction SilentlyContinue }
          }
          PSEOF
          sed -i 's/^          //' "$PS1_LOCAL"
          # Convert IIS target to Windows backslash path for PowerShell -LiteralPath
          WIN_TARGET="${IIS_TARGET//\//\\}"
          export SSHPASS="$SSH_PASSWORD"
          SSH_OPTS=(-o StrictHostKeyChecking=accept-new -o PubkeyAuthentication=no -o PreferredAuthentications=password -o ConnectTimeout=20 -o ServerAliveInterval=15)
          sshpass -e ssh "${SSH_OPTS[@]}" -p "$SSH_PORT" "${SSH_USERNAME}@${SSH_HOST}" "cmd /c if not exist C:\\Temp mkdir C:\\Temp"
          sshpass -e scp "${SSH_OPTS[@]}" -P "$SSH_PORT" "$ZIP" "$PS1_LOCAL" "${SSH_USERNAME}@${SSH_HOST}:C:/Temp/"
          # Unquoted args — Windows OpenSSH preserves them correctly
          sshpass -e ssh "${SSH_OPTS[@]}" -p "$SSH_PORT" "${SSH_USERNAME}@${SSH_HOST}" \
            "powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File C:\\Temp\\deploy-ui.ps1 -Site ${IIS_SITE} -Target ${WIN_TARGET} -ZipPath C:\\Temp\\ui-dev-${RUN_ID}.zip"

  deploy-qa:
    name: Build & Deploy QA
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_qa == true
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: Diagnocare-UI

    steps:
      - name: Checkout UI only
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            Diagnocare-UI
          sparse-checkout-cone-mode: true
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: Diagnocare-UI/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build QA
        run: npx ng build --configuration qa --progress=false

      - name: Package + deploy QA via SSH
        working-directory: .
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          IIS_SITE: ${{ vars.QA_IIS_SITE_NAME }}
          IIS_TARGET: ${{ vars.QA_UI_TARGET_PATH }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq sshpass >/dev/null
          ZIP="/tmp/ui-qa-${RUN_ID}.zip"
          PS1_LOCAL="/tmp/deploy-ui.ps1"
          (cd Diagnocare-UI/dist/diagnocareUI-app && zip -qr "$ZIP" .)
          cat > "$PS1_LOCAL" <<'PSEOF'
          param(
            [Parameter(Mandatory=$true)][string]$Site,
            [Parameter(Mandatory=$true)][string]$Target,
            [Parameter(Mandatory=$true)][string]$ZipPath
          )
          $ErrorActionPreference = 'Stop'
          Write-Host "Site=$Site Target=$Target Zip=$ZipPath"
          Import-Module WebAdministration
          $stage = Join-Path $env:TEMP ("ui-stage-" + [guid]::NewGuid().ToString('N'))
          try {
            if ((Get-Website -Name $Site).State -eq 'Started') { Stop-Website -Name $Site }
            New-Item -ItemType Directory -Path $stage | Out-Null
            Expand-Archive -LiteralPath $ZipPath -DestinationPath $stage -Force
            if (-not (Test-Path -LiteralPath $Target)) { New-Item -ItemType Directory -Path $Target | Out-Null }
            Get-ChildItem -LiteralPath $Target -Force -ErrorAction SilentlyContinue | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
            & robocopy $stage $Target /E /NFL /NDL /NJH /NJS /nc /ns /np | Out-Null
            if ($LASTEXITCODE -ge 8) { throw "robocopy failed with exit $LASTEXITCODE" }
            if ((Get-Website -Name $Site).State -ne 'Started') { Start-Website -Name $Site }
            Write-Host '[OK] UI deployed'
          } finally {
            if (Test-Path -LiteralPath $stage) { Remove-Item -Recurse -Force $stage -ErrorAction SilentlyContinue }
            if (Test-Path -LiteralPath $ZipPath) { Remove-Item -Force $ZipPath -ErrorAction SilentlyContinue }
          }
          PSEOF
          sed -i 's/^          //' "$PS1_LOCAL"
          WIN_TARGET="${IIS_TARGET//\//\\}"
          export SSHPASS="$SSH_PASSWORD"
          SSH_OPTS=(-o StrictHostKeyChecking=accept-new -o PubkeyAuthentication=no -o PreferredAuthentications=password -o ConnectTimeout=20 -o ServerAliveInterval=15)
          sshpass -e ssh "${SSH_OPTS[@]}" -p "$SSH_PORT" "${SSH_USERNAME}@${SSH_HOST}" "cmd /c if not exist C:\\Temp mkdir C:\\Temp"
          sshpass -e scp "${SSH_OPTS[@]}" -P "$SSH_PORT" "$ZIP" "$PS1_LOCAL" "${SSH_USERNAME}@${SSH_HOST}:C:/Temp/"
          sshpass -e ssh "${SSH_OPTS[@]}" -p "$SSH_PORT" "${SSH_USERNAME}@${SSH_HOST}" \
            "powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File C:\\Temp\\deploy-ui.ps1 -Site ${IIS_SITE} -Target ${WIN_TARGET} -ZipPath C:\\Temp\\ui-qa-${RUN_ID}.zip"
