# ============================================================
# UI Build & Deploy (Dev/QA) — fast path
# - Build on ubuntu-latest (GitHub-hosted, cached npm)
# - Deploy via zip + OpenSSH (no appleboy/drone-scp on Windows)
# - Push → DEV only; workflow_dispatch can also deploy QA
# ============================================================

name: UI Build & Deploy (Dev/QA)

on:
  push:
    branches:
      - master_UI
    paths:
      - "Diagnocare-UI/**"
      - ".github/workflows/ui-dev-qa.yml"
  workflow_dispatch:
    inputs:
      deploy_qa:
        description: "Also deploy QA (builds QA config in parallel with DEV)"
        type: boolean
        default: false
        required: true

concurrency:
  group: ui-dev-qa-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: ${{ vars.NODE_VERSION || '22' }}

jobs:
  deploy-dev:
    name: Build & Deploy DEV
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: Diagnocare-UI

    steps:
      - name: Checkout UI only
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            Diagnocare-UI
          sparse-checkout-cone-mode: true
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: Diagnocare-UI/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build DEV
        run: npx ng build --configuration development --progress=false

      - name: Package + deploy DEV via SSH
        working-directory: .
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          IIS_SITE: ${{ vars.DEV_IIS_SITE_NAME }}
          IIS_TARGET: ${{ vars.DEV_UI_TARGET_PATH }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass unzip >/dev/null
          STAGE="C:/Temp/ui-dev-${RUN_ID}"
          ZIP="/tmp/ui-dev-${RUN_ID}.zip"
          (
            cd Diagnocare-UI/dist/diagnocareUI-app
            zip -qr "$ZIP" .
          )
          export SSHPASS="$SSH_PASSWORD"
          SSH_OPTS=(-o StrictHostKeyChecking=accept-new -o PubkeyAuthentication=no -o PreferredAuthentications=password -o ConnectTimeout=20)
          sshpass -e scp "${SSH_OPTS[@]}" -P "$SSH_PORT" "$ZIP" "${SSH_USERNAME}@${SSH_HOST}:C:/Temp/ui-dev-${RUN_ID}.zip"
          sshpass -e ssh "${SSH_OPTS[@]}" -p "$SSH_PORT" "${SSH_USERNAME}@${SSH_HOST}" \
            "powershell.exe -NoProfile -NonInteractive -Command \"
              \\\$ErrorActionPreference='Stop'
              Import-Module WebAdministration
              \\\$site='${IIS_SITE}'
              \\\$target='${IIS_TARGET}'
              \\\$stage='${STAGE}'
              \\\$zip='C:\\Temp\\ui-dev-${RUN_ID}.zip'
              if ((Get-Website -Name \\\$site).State -eq 'Started') { Stop-Website -Name \\\$site }
              if (Test-Path \\\$stage) { Remove-Item -Recurse -Force \\\$stage }
              New-Item -ItemType Directory -Path \\\$stage | Out-Null
              Expand-Archive -Path \\\$zip -DestinationPath \\\$stage -Force
              if (-not (Test-Path \\\$target)) { New-Item -ItemType Directory -Path \\\$target | Out-Null }
              Get-ChildItem -Path \\\$target -Force | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
              robocopy \\\$stage \\\$target /E /NFL /NDL /NJH /NJS /nc /ns /np | Out-Null
              if (\\\$LASTEXITCODE -ge 8) { throw \\\"robocopy failed \\\$LASTEXITCODE\\\" }
              if ((Get-Website -Name \\\$site).State -ne 'Started') { Start-Website -Name \\\$site }
              Remove-Item -Force \\\$zip -ErrorAction SilentlyContinue
              Remove-Item -Recurse -Force \\\$stage -ErrorAction SilentlyContinue
              Write-Host '[OK] DEV UI deployed'
            \""

  deploy-qa:
    name: Build & Deploy QA
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_qa == true
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: Diagnocare-UI

    steps:
      - name: Checkout UI only
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            Diagnocare-UI
          sparse-checkout-cone-mode: true
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: Diagnocare-UI/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build QA
        run: npx ng build --configuration qa --progress=false

      - name: Package + deploy QA via SSH
        working-directory: .
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          IIS_SITE: ${{ vars.QA_IIS_SITE_NAME }}
          IIS_TARGET: ${{ vars.QA_UI_TARGET_PATH }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass unzip >/dev/null
          STAGE="C:/Temp/ui-qa-${RUN_ID}"
          ZIP="/tmp/ui-qa-${RUN_ID}.zip"
          (
            cd Diagnocare-UI/dist/diagnocareUI-app
            zip -qr "$ZIP" .
          )
          export SSHPASS="$SSH_PASSWORD"
          SSH_OPTS=(-o StrictHostKeyChecking=accept-new -o PubkeyAuthentication=no -o PreferredAuthentications=password -o ConnectTimeout=20)
          sshpass -e scp "${SSH_OPTS[@]}" -P "$SSH_PORT" "$ZIP" "${SSH_USERNAME}@${SSH_HOST}:C:/Temp/ui-qa-${RUN_ID}.zip"
          sshpass -e ssh "${SSH_OPTS[@]}" -p "$SSH_PORT" "${SSH_USERNAME}@${SSH_HOST}" \
            "powershell.exe -NoProfile -NonInteractive -Command \"
              \\\$ErrorActionPreference='Stop'
              Import-Module WebAdministration
              \\\$site='${IIS_SITE}'
              \\\$target='${IIS_TARGET}'
              \\\$stage='${STAGE}'
              \\\$zip='C:\\Temp\\ui-qa-${RUN_ID}.zip'
              if ((Get-Website -Name \\\$site).State -eq 'Started') { Stop-Website -Name \\\$site }
              if (Test-Path \\\$stage) { Remove-Item -Recurse -Force \\\$stage }
              New-Item -ItemType Directory -Path \\\$stage | Out-Null
              Expand-Archive -Path \\\$zip -DestinationPath \\\$stage -Force
              if (-not (Test-Path \\\$target)) { New-Item -ItemType Directory -Path \\\$target | Out-Null }
              Get-ChildItem -Path \\\$target -Force | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
              robocopy \\\$stage \\\$target /E /NFL /NDL /NJH /NJS /nc /ns /np | Out-Null
              if (\\\$LASTEXITCODE -ge 8) { throw \\\"robocopy failed \\\$LASTEXITCODE\\\" }
              if ((Get-Website -Name \\\$site).State -ne 'Started') { Start-Website -Name \\\$site }
              Remove-Item -Force \\\$zip -ErrorAction SilentlyContinue
              Remove-Item -Recurse -Force \\\$stage -ErrorAction SilentlyContinue
              Write-Host '[OK] QA UI deployed'
            \""
