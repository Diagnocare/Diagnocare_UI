<div class="cal-nav">
  <button class="cal-nav-btn" (click)="onPrev()" title="Previous month"><i class="fa fa-chevron-left"></i></button>
  <span class="cal-month-label">{{ viewLabel }}</span>
  <button class="cal-nav-btn" (click)="onNext()" title="Next month"><i class="fa fa-chevron-right"></i></button>
</div>

<table class="cal-table">
  <thead>
    <tr>
      <th *ngFor="let d of weekDays" class="cal-dow">{{ d }}</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let week of calendarWeeks">
      <td *ngFor="let day of week"
          class="cal-cell"
          [class.other-month]="!day.inMonth"
          [class.today]="day.isToday"
          [class.selected]="isSelected(day)"
          [class.has-visits]="day.visitInfo && day.inMonth"
          [class.is-holiday]="day.isHoliday && day.inMonth && showHolidays"
          [class.has-conflict]="day.hasConflict && day.inMonth && showHolidays"
          [attr.title]="dayTitle(day) || null"
          (click)="onSelect(day)">

        <span class="cal-day-num">{{ day.date.getDate() }}</span>

        <!-- Marker row — visit count and holiday label sit side by side -->
        <span class="cal-markers">
          <span class="cal-badge" *ngIf="day.visitInfo && day.inMonth"
                [class.cal-badge--all-done]="day.visitInfo.pendingCount === 0"
                [class.cal-badge--conflict]="day.hasConflict && showHolidays">
            {{ day.visitInfo.count }}
          </span>

          <span class="cal-tag cal-tag--holiday"
                *ngIf="day.isHoliday && day.inMonth && showHolidays"
                [attr.title]="day.holidayName">
            {{ day.holidayName || 'Holiday' }}
          </span>
        </span>

        <!-- Conflict marker: visits still scheduled on a holiday -->
        <i class="fa fa-exclamation-triangle cal-conflict-icon"
           *ngIf="day.hasConflict && day.inMonth && showHolidays"
           title="Visit scheduled on a holiday"></i>
      </td>
    </tr>
  </tbody>
</table>

<div class="cal-legend">
  <span class="leg-item"><span class="leg-dot leg-dot--pending"></span> Pending</span>
  <span class="leg-item"><span class="leg-dot leg-dot--done"></span> All Done</span>
  <span class="leg-item"><span class="leg-dot leg-dot--today"></span> Today</span>
  <span class="leg-item" *ngIf="hasAnyHoliday"><span class="leg-dot leg-dot--holiday"></span> Holiday</span>
  <span class="leg-item" *ngIf="hasAnyHoliday">
    <i class="fa fa-exclamation-triangle leg-warn"></i> Visit on holiday
  </span>
</div>
