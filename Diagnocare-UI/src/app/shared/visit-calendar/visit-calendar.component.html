<div class="cal-head">
  <h3 class="cal-month-label">
    {{ months[viewMonth - 1] }} <span class="cal-year">{{ viewYear }}</span>
  </h3>
  <div class="cal-nav">
    <button type="button" class="cal-nav-btn" (click)="onPrev()" title="Previous month" aria-label="Previous month">
      <i class="fa fa-chevron-left"></i>
    </button>
    <button type="button" class="cal-nav-btn" (click)="onNext()" title="Next month" aria-label="Next month">
      <i class="fa fa-chevron-right"></i>
    </button>
  </div>
</div>

<table class="cal-table">
  <thead>
    <tr>
      <th *ngFor="let d of weekDays" class="cal-dow">{{ d.charAt(0) }}<span class="cal-dow-rest">{{ d.slice(1) }}</span></th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let week of calendarWeeks">
      <td *ngFor="let day of week"
          class="cal-cell"
          [class.other-month]="!day.inMonth"
          [class.today]="day.isToday && day.inMonth"
          [class.selected]="isSelected(day)"
          [class.is-holiday]="day.isHoliday && day.inMonth && showHolidays"
          [attr.title]="dayTitle(day) || null"
          (click)="onSelect(day)">

        <div class="cal-cell-inner">
          <span class="cal-day-num">{{ day.date.getDate() }}</span>

          <span class="cal-markers" *ngIf="day.inMonth">
            <span class="cal-count" *ngIf="day.visitInfo"
                  [class.cal-count--done]="day.visitInfo.pendingCount === 0"
                  [class.cal-count--conflict]="day.hasConflict && showHolidays">
              {{ day.visitInfo.count }}
            </span>
            <span class="cal-dot cal-dot--holiday" *ngIf="day.isHoliday && showHolidays"></span>
          </span>
        </div>
      </td>
    </tr>
  </tbody>
</table>

<div class="cal-legend">
  <span class="leg-item"><span class="leg-swatch leg-swatch--pending"></span>Pending</span>
  <span class="leg-item"><span class="leg-swatch leg-swatch--done"></span>Completed</span>
  <span class="leg-item" *ngIf="hasAnyHoliday"><span class="leg-swatch leg-swatch--holiday"></span>Holiday</span>
  <span class="leg-item" *ngIf="hasAnyHoliday"><span class="leg-swatch leg-swatch--conflict"></span>On a holiday</span>
</div>
