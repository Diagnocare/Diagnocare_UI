<div class="modal fade" id="confirmModal" tabindex="-1" aria-labelledby="confirmModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="confirmModalLabel">{{ title }}</h5>
        <button type="button" class="btn-close" (click)="onCancel()" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        {{ message }}
      </div>
      <div class="modal-footer">
        <button *ngIf="!hideCancelButton" type="button" class="btn btn-secondary" (click)="onCancel()" [disabled]="isLoading">{{ cancelText }}</button>
        <button type="button" class="btn btn-danger" (click)="onConfirm()" [disabled]="isLoading">
          <span *ngIf="isLoading" class="spinner-border spinner-border-sm me-1" role="status" aria-hidden="true"></span>
          {{ confirmText }}
        </button>
      </div>
    </div>
  </div>
</div>
