<app-loading-spinner [isLoading]="isLoading" message="Loading your visits…"></app-loading-spinner>

<div class="page-container pathology-theme">

  <!-- ── Header ─────────────────────────────────────────────────────────────── -->
  <div class="page-header">
    <div class="header-left">
      <h1><i class="fa fa-route"></i> My Visits</h1>
      <p class="subtitle">Track your assigned field visits</p>
    </div>
  </div>

  <div class="vs-layout">

    <!-- ════════════════════════════════════════ CALENDAR ═══════════════════ -->
    <div class="vs-calendar-panel">
      <app-visit-calendar
        [calendarData]="calendarData"
        [viewYear]="viewYear"
        [viewMonth]="viewMonth"
        [selectedDate]="selectedDate"
        (prevMonth)="onPrevMonth()"
        (nextMonth)="onNextMonth()"
        (daySelected)="onDaySelected($event)">
      </app-visit-calendar>
    </div>

    <!-- ════════════════════════════════════════ DETAIL PANEL ════════════════ -->
    <div class="vs-detail-panel" *ngIf="selectedDate">

      <div class="detail-header">
        <div class="detail-title">
          <i class="fa fa-calendar-day"></i>
          <span>{{ selectedDate | date:'EEEE, d MMMM yyyy' }}</span>
        </div>
        <button class="btn btn-outline btn-sm" (click)="loadVisits()" [disabled]="isLoading">
          <i class="fa fa-sync-alt" [class.fa-spin]="isLoading"></i> Refresh
        </button>
      </div>

      <div *ngIf="!isLoading">

        <!-- Status filter chips -->
        <div class="vc-status-filter" *ngIf="visits.length > 0">
          <button class="vc-filter-chip" [class.active]="statusFilter === 'all'"
                  (click)="statusFilter = 'all'">
            All <span class="vc-filter-count">{{ visits.length }}</span>
          </button>
          <button class="vc-filter-chip vc-filter-chip--pending"
                  [class.active]="statusFilter === 'Pending'"
                  (click)="statusFilter = 'Pending'">
            Pending <span class="vc-filter-count">{{ pendingCount }}</span>
          </button>
          <button class="vc-filter-chip vc-filter-chip--done"
                  [class.active]="statusFilter === 'Completed'"
                  (click)="statusFilter = 'Completed'">
            Completed <span class="vc-filter-count">{{ completedCount }}</span>
          </button>
        </div>

        <!-- Empty states -->
        <div *ngIf="visits.length === 0" class="no-visits">
          <i class="fa fa-calendar-times"></i>
          <p>No visits scheduled for this day.</p>
        </div>
        <div *ngIf="visits.length > 0 && filteredVisits.length === 0" class="no-visits" style="padding:1rem 0">
          <i class="fa fa-filter"></i>
          <p>No {{ statusFilter === 'Pending' ? 'pending' : 'completed' }} visits for this day.</p>
        </div>

        <!-- Visit cards (shared component) -->
        <div class="visit-card-grid">
          <app-visit-card
            *ngFor="let v of filteredVisits"
            [visit]="v"
            [showMember]="false"
            [canManage]="false"
            (complete)="openCompleteModal($event)"
            (viewDetails)="openViewDetails($event)">
          </app-visit-card>
        </div>
      </div>

    </div>

    <!-- No day selected -->
    <div class="vs-detail-panel vs-detail-panel--empty" *ngIf="!selectedDate">
      <div class="empty-state">
        <i class="fa fa-calendar-alt fa-3x"></i>
        <p>Click a day on the calendar to view your visits.</p>
      </div>
    </div>

  </div><!-- /vs-layout -->
</div>

<!-- ── Mark-Complete modal ───────────────────────────────────────────────────── -->
<app-visit-complete-modal
  *ngIf="completingVisit"
  [visitName]="completingVisit.contactName"
  [saving]="savingComplete"
  (confirmed)="onCompleteConfirmed($event)"
  (cancelled)="onCompleteCancelled()">
</app-visit-complete-modal>

<!-- ── View Completion Details modal ────────────────────────────────────────── -->
<app-visit-complete-modal
  *ngIf="viewingVisit"
  [viewMode]="true"
  [visitName]="viewingVisit.contactName"
  [viewRemark]="viewingVisit.completionRemark ?? null"
  [viewLocation]="viewingVisit.completionLocation ?? null"
  [viewPhotoBase64]="viewingVisit.completionPhotoBase64 ?? null"
  [viewCompletedAt]="viewingVisit.completedAt ?? null"
  (cancelled)="closeViewDetails()">
</app-visit-complete-modal>
