<div class="page-container pathology-theme">
  <!-- Loading Spinner -->
  <app-loading-spinner [isLoading]="isLoading" message="Loading test details..."></app-loading-spinner>

  <!-- Header -->
  <div class="page-header">
    <div class="header-left">
      <h2>Edit Patient Test</h2>
      <p class="subtitle">Modify test information</p>
    </div>
    <div class="header-actions">
      <button class="btn btn-back" (click)="clickBack()">
        <i class="fa fa-arrow-left"></i> Back
      </button>
    </div>
  </div>

  <div class="content-container">
    <div class="card">
      <div class="card-header">
        <h3>Test Details</h3>
      </div>
      <div class="card-body">
        <div class="no-data" *ngIf="!isLoading">
          <i class="fa fa-edit"></i>
          <p>Edit test details for Test ID: {{testId}}</p>
        </div>
      </div>
    </div>
  </div>
</div>
