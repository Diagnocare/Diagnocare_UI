<div class="page-container">
  <div class="page-header">
    <div class="header-left">
      <h1>Delete Contact</h1>
      <p class="subtitle">This action cannot be undone</p>
    </div>
    <div class="header-actions">
      <button (click)="cancel()" class="btn btn-back">
        <i class="fa fa-arrow-left"></i> Back
      </button>
    </div>
  </div>

  <div class="content-container">
    <div class="card delete-confirm-card">
      <div class="delete-icon-wrap">
        <i class="fa fa-trash-o delete-icon"></i>
      </div>
      <h3>Are you sure you want to delete this contact?</h3>
      <p class="delete-hint">Once deleted, the contact record will be permanently removed and cannot be recovered.</p>
      <app-loading-spinner [isLoading]="isLoading" message="Deleting..."></app-loading-spinner>
      <div class="form-actions" *ngIf="!isLoading">
        <button (click)="cancel()" class="btn btn-cancel">
          <i class="fa fa-times"></i> Cancel
        </button>
        <button (click)="confirmDelete()" [disabled]="isLoading" class="btn btn-danger">
          <i class="fa fa-trash"></i> Yes, Delete
        </button>
      </div>
    </div>
  </div>
</div>
