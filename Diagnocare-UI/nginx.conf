# ──────────────────────────────────────────────────────────────────────────────
# nginx: serve the Angular SPA and reverse-proxy the API + SignalR hub.
#
# Because the browser talks only to THIS origin (same-origin), there are no CORS
# preflights to configure — nginx forwards /api and /hubs to the API container
# server-side. This mirrors a typical production edge setup.
# ──────────────────────────────────────────────────────────────────────────────

# The API service hostname on the docker network (compose service name).
# Overridable via the API_UPSTREAM build/run arg if you rename the service.
upstream diagnocare_api {
    server api:8080;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── Security headers (SEC-015) ───────────────────────────────────────────
    # nginx drops inherited add_header directives in any block that declares its own,
    # so the same set is repeated in each such location below. CSP is report-only
    # until the inline theme script and CDN assets are inventoried (SEC-027).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https: wss:; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;

    # ── Compression ───────────────────────────────────────────────────────────
    # PERF-036: the official nginx:alpine image ships `#gzip on;` COMMENTED OUT
    # in its main config, so this path served every bundle uncompressed — the
    # single largest transfer win available here, and the one the API still owes
    # on its own side (PERF-008).
    #
    # Declared in the server block so it travels with this file rather than
    # depending on an edit to the image's nginx.conf. woff2 is deliberately
    # absent from gzip_types: it is already compressed, and re-compressing it
    # costs CPU to add bytes.
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css application/javascript application/json
                      application/manifest+json application/wasm image/svg+xml;

    # Never cache the runtime config or index — they carry per-env values.
    location = /assets/runtime-config.js {
        add_header Cache-Control "no-store";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https: wss:; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
    }
    location = /index.html {
        add_header Cache-Control "no-store";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https: wss:; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
    }

    # ── Content-hashed build output ────────────────────────────────────────────
    # The production build sets outputHashing: "all", and webpack emits every
    # bundle, lazy chunk, stylesheet and font at the server ROOT, not under
    # /assets/: main.<hash>.js, styles.<hash>.css, fa-solid-900.<hash>.woff2.
    # Until this block existed they fell through to `location /` with no cache
    # headers at all, so each one cost a conditional request on every page load
    # — ~9 files plus a chunk per route, and the 304 saves the bytes but not the
    # round trip.
    #
    # The filename IS the content address here, so pinning for a year is safe:
    # a rebuild changes the bytes AND the URL, so a cached entry can never go
    # stale. Single-segment ([^/]+) on purpose — it must not reach the
    # un-hashed files copied verbatim from src/assets/, and `html`/`ico` are
    # absent so index.html and favicon.ico keep revalidating.
    #
    # No `expires` directive: it would emit its own Cache-Control alongside the
    # add_header below, giving two headers for the same key.
    #
    # Mirrors the first rule in vercel.json.
    location ~ ^/[^/]+\.(?:js|mjs|css|woff2|woff|ttf|otf|eot|svg|png|jpe?g|gif|webp|avif)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https: wss:; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
        access_log off;
    }

    # Un-hashed files copied straight from src/assets/ (logo, placeholder
    # avatar). Short cache, revalidated — the name never changes, so a long one
    # would strand a replaced image in browser caches.
    location /assets/ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https: wss:; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
    }

    # ── REST API ──────────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://diagnocare_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # ── SignalR hub (WebSocket upgrade required) ────────────────────────────────
    location /hubs/ {
        proxy_pass         http://diagnocare_api;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;   # keep long-lived sockets open
    }

    # ── SPA fallback: every other path returns index.html ──────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
