# ──────────────────────────────────────────────────────────────────────────────
# nginx: serve the Angular SPA and reverse-proxy the API + SignalR hub.
#
# Because the browser talks only to THIS origin (same-origin), there are no CORS
# preflights to configure — nginx forwards /api and /hubs to the API container
# server-side. This mirrors a typical production edge setup.
# ──────────────────────────────────────────────────────────────────────────────

# The API service hostname on the docker network (compose service name).
# Overridable via the API_UPSTREAM build/run arg if you rename the service.
upstream diagnocare_api {
    server api:8080;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Never cache the runtime config or index — they carry per-env values.
    location = /assets/runtime-config.js {
        add_header Cache-Control "no-store";
    }
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # Hashed static assets can be cached aggressively.
    location /assets/ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
    }

    # ── REST API ──────────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://diagnocare_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # ── SignalR hub (WebSocket upgrade required) ────────────────────────────────
    location /hubs/ {
        proxy_pass         http://diagnocare_api;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;   # keep long-lived sockets open
    }

    # ── SPA fallback: every other path returns index.html ──────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
